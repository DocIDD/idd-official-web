<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>404 · DoctorIDD</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/logo-thumb.png" />
  <link rel="stylesheet" href="/assets/css/style.css?v=20261003" />
</head>
<body>

      <a class="site-brand" href="/"><span id="site-brand">DoctorIDD</span></a>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a href="/#about">介绍</a>
        <a href="/#announcements">公告</a>
        <a href="/#members">成员</a>

      <a class="btn btn--primary" href="/">返回首页</a>
    </div>
  </main>

  <script src="/assets/js/announcement-format.js?v=20261003"></script>
  <script src="/assets/js/announcements.js?v=20261003"></script>
